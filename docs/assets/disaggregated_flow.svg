<rect x="805" y="420" width="520" height="170" rx="18" fill="#33253b" stroke="#e879f9" stroke-width="3"/><text x="1065" y="465" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#fae8ff">Generation / decode</text><text x="1065" y="505" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#fae8ff">GPU 1 · port 8002</text><text x="1065" y="542" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#f5d0fe">Produces output tokens</text>
