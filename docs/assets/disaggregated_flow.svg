<rect x="420" y="250" width="280" height="120" rx="16" fill="#17243a" stroke="#7dd3fc" stroke-width="2"/><text x="560" y="297" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#e0f2fe">Router :8000</text><text x="560" y="333" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#cbd5e1">Routes request stages</text><path d="M320 310H420 M407 299L420 310L407 321" stroke="#7dd3fc" stroke-width="4" fill="none"/>
