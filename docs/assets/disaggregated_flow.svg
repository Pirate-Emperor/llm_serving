<rect x="420" y="635" width="905" height="68" rx="12" fill="#382f1a" stroke="#fbbf24" stroke-width="2"/><text x="872" y="677" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#fef3c7">KV state transfer uses the configured NIXL backend</text><text x="64" y="700" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#94a3b8">Requires two visible GPUs and a compatible TensorRT-LLM environment.</text></svg>