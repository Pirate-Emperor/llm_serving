<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
<rect width="1440" height="760" rx="26" fill="#0b1220"/><text x="64" y="70" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Separate context and generation workers</text><text x="64" y="112" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#b6c2d2">Requests pass through a router. Prompt state transfers to the decode worker through NIXL.</text>
