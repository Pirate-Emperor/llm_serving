<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
<rect width="1440" height="720" rx="26" fill="#0b1220"/><text x="64" y="68" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Decode-first scheduling</text><text x="64" y="110" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#b6c2d2">Each iteration reserves one token for active requests before using remaining budget on prompt chunks.</text>
<rect x="64" y="155" width="1312" height="435" rx="16" fill="#111c2f" stroke="#334155" stroke-width="2"/><text x="100" y="200" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#e2e8f0">One scheduler iteration · example configuration</text>
<rect x="110" y="245" width="500" height="86" rx="12" fill="#17456a" stroke="#38bdf8" stroke-width="2"/><text x="360" y="280" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#e0f2fe">Decode work</text><text x="360" y="311" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#bae6fd">8 active requests × 1 token = 8 tokens</text>
<path d="M610 288H708 M695 277L708 288L695 299" stroke="#94a3b8" stroke-width="4" fill="none"/>
<rect x="708" y="245" width="600" height="86" rx="12" fill="#16312f" stroke="#34d399" stroke-width="2"/><text x="1008" y="280" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#d1fae5">Remaining token budget</text><text x="1008" y="311" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#a7f3d0">64 − 8 = 56 tokens available for prefill</text>
<path d="M1008 331V382 M997 369L1008 382L1019 369" stroke="#34d399" stroke-width="4" fill="none"/>
<rect x="708" y="382" width="600" height="90" rx="12" fill="#33253b" stroke="#e879f9" stroke-width="2"/><text x="1008" y="418" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#fae8ff">Bounded prompt chunks</text><text x="1008" y="450" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#f5d0fe">Chunk cap limits each waiting request</text>
<rect x="110" y="382" width="500" height="90" rx="12" fill="#17243a" stroke="#64748b" stroke-width="2"/><text x="360" y="418" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Request rotation</text><text x="360" y="450" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#cbd5e1">Incomplete prompts rejoin the queue</text>
<rect x="64" y="620" width="1312" height="58" rx="12" fill="#17243a"/><text x="90" y="657" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#e2e8f0">Decode-gap result: 1 scheduler iteration in the recorded controlled simulation; not GPU ITL.</text></svg>